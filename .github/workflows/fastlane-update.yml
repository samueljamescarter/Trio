name: Update and Run Fastlane

on:
  push:
    branches: [ main ] # Change this to 'master' if your main branch uses the old naming

jobs:
  fastlane-run:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: false 

    - name: Update Fastlane Gem
      run: bundle update fastlane

    - name: Run Fastlane Lane
      run: bundle exec fastlane your_lane_name

